{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-monitoring.fullname" . }}-prometheus
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: prometheus
  ports:
    - port: 9090
      targetPort: 9090
{{- end }}
