{{- if .Values.kubeStateMetrics.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-monitoring.fullname" . }}-kube-state-metrics
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-monitoring.fullname" . }}-kube-state-metrics
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-monitoring.fullname" . }}-kube-state-metrics
roleRef:
  kind: ClusterRole
  name: {{ include "k8s-monitoring.fullname" . }}-kube-state-metrics
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-monitoring.fullname" . }}-kube-state-metrics
    namespace: {{ .Values.namespace }}
{{- end }}
