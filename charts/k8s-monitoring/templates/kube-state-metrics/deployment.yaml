{{- if .Values.kubeStateMetrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-monitoring.fullname" . }}-kube-state-metrics
  namespace: {{ .Values.namespace }}
  labels: {{- include "k8s-monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: &sel
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: kube-state-metrics
  template:
    metadata:
      labels: *sel
    spec:
      serviceAccountName: {{ include "k8s-monitoring.fullname" . }}-kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: "{{ .Values.kubeStateMetrics.image.repository }}:{{ .Values.kubeStateMetrics.image.tag }}"
          ports: [{ containerPort: 8080 }]
{{- end }}
