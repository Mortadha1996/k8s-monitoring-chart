# Global
nameOverride: ""
namespace: monitoring

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.54.1
  retention: 15d
  scrapeInterval: 30s
  evaluationInterval: 30s

  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 2Gi
      cpu: 1000m

  persistence:
    enabled: false          # emptyDir by default — set true and give a size for real use
    size: 10Gi
    storageClass: ""

  # Scrape targets beyond the cluster itself
  extraScrapeConfigs:
    - job_name: dcgm-exporter
      static_configs:
        - targets: ['dcgm-exporter:9400']

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.2.0"
  adminPassword: "changeme"   # override at install time
  anonymousAccess: false

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 300m

  persistence:
    enabled: false
    size: 5Gi

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.27.0

  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 256Mi
      cpu: 200m

  # Where alerts go. Empty means alerts fire but go nowhere — useful for testing,
  # useless in production.
  receivers:
    slack:
      enabled: false
      webhookUrl: ""
      channel: "#alerts"
    email:
      enabled: false
      to: ""
      from: ""
      smarthost: ""

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: v1.8.2

kubeStateMetrics:
  enabled: true
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.13.0

# Alert rules — each group can be disabled
alerts:
  nodeHealth: true
  podHealth: true
  resourcePressure: true
  diskSpace: true
